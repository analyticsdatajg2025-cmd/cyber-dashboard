name: Monitor Diario
on:
  schedule:
    # 15:20 UTC = 10:20 Lima. Despues de que el Sheet mensual ya esta llenado
    # (max 10:00) y con AYER ya cerrado en Yandex.
    - cron: "51 19 * * *"
  workflow_dispatch:      # boton para correr manual
permissions:
  contents: write
jobs:
  reporte:
    runs-on: ubuntu-latest
    env:
      TZ: America/Lima     # sin esto date.today() se adelanta de noche
      MODO: diario         # si hoy cae en ventana cyber, el pipeline se salta solo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: deps-${{ hashFiles('requirements.txt') }}
      - name: Instalar dependencias
        # Sin Playwright: el diario no genera PNG ni correo.
        run: pip install -r requirements.txt
      - name: Escribir secretos a archivos locales
        run: |
          echo "${{ secrets.YANDEX_TOKEN }}" > mi_token.txt
          printf '%s\n%s\n' "${{ secrets.GMAIL_USER }}" "${{ secrets.GMAIL_PASS }}" > gmail.txt
          echo '${{ secrets.GOOGLE_CREDS }}' > credenciales.json
      - name: Correr pipeline
        run: python pipeline.py
      - name: Commitear JSONs
        if: success()
        run: |
          git config user.name  "cyber-bot"
          git config user.email "bot@conecta.pe"
          # add explicito (NUNCA -A ni .) para no subir los secretos del disco
          git add data.json
          git add historico.json || true
          git add neto.json || true
          git commit -m "diario $(date -u +%F) $(date -u +%H:%M) UTC" || echo "sin cambios"
          # neto.py puede haber pusheado desde la PC entre medio
          git pull --rebase && git push
      - name: Limpiar secretos
        if: always()
        run: rm -f mi_token.txt gmail.txt credenciales.json
