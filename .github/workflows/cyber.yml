name: Cyber Dashboard
on:
  # Sin schedule: lo dispara cron-job.org (workflow_dispatch via API) en horario
  # Lima. El cron de GitHub llegaba con 1-3 h de atraso y duplicaba correos.
  # Si cron-job.org se cae, se puede correr a mano con "Run workflow".
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cyber            # si cron-job.org y el cron de GitHub coinciden, no corren a la vez
  cancel-in-progress: false
jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODO: cyber
      TZ: America/Lima    # el runner corre en UTC; sin esto date.today() se adelanta de noche
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache de pip y Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: deps-${{ hashFiles('requirements.txt') }}
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
      - name: Escribir secretos a archivos locales
        run: |
          echo "${{ secrets.YANDEX_TOKEN }}" > mi_token.txt
          printf '%s\n%s\n' "${{ secrets.GMAIL_USER }}" "${{ secrets.GMAIL_PASS }}" > gmail.txt
          echo '${{ secrets.GOOGLE_CREDS }}' > credenciales.json
      - name: Correr pipeline
        run: python pipeline.py
      - name: Commitear JSONs
        if: success()
        run: |
          git config user.name  "cyber-bot"
          git config user.email "bot@conecta.pe"
          # add explicito (NUNCA -A ni .) para no subir los secretos del disco
          git add data.json
          git add historico.json || true
          git add neto.json || true
          git commit -m "corte $(date -u +%H:%M) UTC" || echo "sin cambios"
          # neto.py (PC) y panel.yml tambien pushean: rebase y reintenta
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Limpiar secretos
        if: always()
        run: rm -f mi_token.txt gmail.txt credenciales.json
