<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel en vivo · Cyber</title>
<style>
/* Pantalla TV horizontal (pensado para 1920x1080, escala con la ventana). */
:root{
  --bg:#0b0d12; --card:#12151c; --line:#232834; --grid:#1b1f29;
  --text:#eef0f4; --muted:#9aa0ad; --hint:#6b7180;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --lc:#F5B800; --efe:#2b8af0; --jz:#a259e6;
  --font:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);
     font-variant-numeric:tabular-nums;overflow:hidden;}
.app{height:100vh;display:flex;flex-direction:column;padding:1.6vh 1.4vw;gap:1.6vh;}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:2vw;
     background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4vh 1.6vw;}
.title{font-size:3.2vh;font-weight:800;letter-spacing:.12em;white-space:nowrap;}
.title .ev{color:var(--lc);}
.title .sub{display:block;font-size:1.4vh;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-top:.4vh;}
.fresh{display:flex;align-items:center;gap:.6vw;font-size:1.8vh;font-weight:700;
       padding:.8vh 1.2vw;border-radius:999px;border:1px solid currentColor;white-space:nowrap;}
.fresh::before{content:'';width:1.1vh;height:1.1vh;border-radius:50%;background:currentColor;}
.fresh.ok{color:var(--ok);} .fresh.warn{color:var(--warn);} .fresh.bad{color:var(--bad);}
.clock{text-align:right;}
.clock b{display:block;font-size:4vh;font-weight:800;letter-spacing:.06em;}
.clock span{font-size:1.4vh;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}

/* ---------- columnas por marca ---------- */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2vw;}
.col{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);
     border-radius:12px;padding:1.6vh 1.2vw;display:flex;flex-direction:column;gap:1.5vh;min-height:0;min-width:0;}
.bh{display:flex;align-items:center;justify-content:space-between;}
.bn{font-size:2.4vh;font-weight:800;letter-spacing:.08em;}
.bn::before{content:'';display:inline-block;width:1.4vh;height:1.4vh;border-radius:3px;
            background:var(--c);margin-right:.6vw;vertical-align:.1vh;}
.st{font-size:1.3vh;font-weight:700;padding:.4vh .8vw;border-radius:999px;}
.st.ok{color:var(--ok);background:rgba(34,197,94,.12);}
.st.bad{color:var(--warn);background:rgba(245,158,11,.14);}

.lbl{font-size:1.25vh;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--hint);}
.big{font-size:6.2vh;font-weight:800;letter-spacing:-.02em;line-height:1.05;}
.big small{font-size:3vh;color:var(--muted);font-weight:700;margin-right:.4vw;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.6vw;}
.kpi{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:1vh .7vw;}
.kpi{min-width:0;}
.kpi .v{font-size:2.6vh;font-weight:800;margin-top:.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.funnel svg{display:block;width:100%;height:14vh;}
.funnel .bandtxt{font-family:var(--font);font-weight:700;}
.funnel .conv{font-family:var(--font);fill:var(--muted);}

.top10{flex:1;min-height:0;overflow:hidden;}
.src td.nm{color:var(--text);}
.src th:not(:first-child){padding-left:.9vw;}
.src td.sh{font-weight:700;padding-right:.8vw;white-space:nowrap;}
table{width:100%;border-collapse:collapse;font-size:1.45vh;}
th{font-size:1.1vh;color:var(--hint);text-align:left;font-weight:700;letter-spacing:.1em;
   text-transform:uppercase;padding:0 0 .6vh;white-space:nowrap;}
td{padding:.55vh 0;border-top:1px solid var(--grid);}
th:nth-child(n+3),td:nth-child(n+3){text-align:right;}
td.r{color:var(--hint);padding-right:.8vw;white-space:nowrap;}
th:first-child{padding-right:.8vw;}
td.nm{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:.8vw;}
td.u{color:var(--muted);padding-right:.8vw;white-space:nowrap;}
td.s{font-weight:700;white-space:nowrap;}
.empty{color:var(--hint);font-size:1.5vh;padding:1vh 0;}

.foot{display:flex;justify-content:space-between;font-size:1.2vh;color:var(--hint);letter-spacing:.06em;}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
     font-size:2.4vh;color:var(--muted);background:var(--bg);}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title"><span id="ev">VENTAS EN VIVO</span>
      <span class="sub">LA CURACAO · TIENDAS EFE · JUNTOZ — DATA GROSS</span></div>
    <div class="fresh warn" id="fresh">Cargando…</div>
    <div class="clock"><b id="hora">--:--:--</b><span id="fecha"></span></div>
  </div>
  <div class="cols" id="cols"></div>
  <div class="foot">
    <span id="dia">—</span>
    <span>Actualización cada 5 minutos</span>
  </div>
</div>
<div class="err" id="err">No se pudo cargar panel.json — reintentando…</div>

<script>
/* ======================= CONFIG ======================= */
const REPO = "https://raw.githubusercontent.com/analyticsdatajg2025-cmd/cyber-dashboard/main/";
const FUENTES = [REPO + "panel.json", "./panel.json"];
const FILAS_FUENTES = 5;               // fuentes visibles por marca
const FILAS_TOP = 5;                  // filas visibles del top por marca
const REFRESCO_MS = 60 * 1000;        // cada cuanto revisa si hay datos nuevos
const FRESCO_MIN = 12, ATRASO_MIN = 25; // verde <= 12 min, ambar <= 25, rojo mas
                                       // (corre cada 5 min + hasta 5 min de cache de GitHub)
const EVENTOS = [                      // [nombre, inicio, fin] (incluye la vispera)
  ["CYBER WOW",  "2026-11-02", "2026-11-08"],
  ["CYBER DAYS", "2026-11-16", "2026-11-18"],
];
const MARCAS = {
  "LA CURACAO":  {css:"--lc",  nombre:"LA CURACAO",  txt:"#1a1d24"},
  "TIENDAS EFE": {css:"--efe", nombre:"TIENDAS EFE", txt:"#ffffff"},
  "JUNTOZ":      {css:"--jz",  nombre:"JUNTOZ",      txt:"#ffffff"},
};
/* ====================================================== */

const fmt = {
  n: v => Number(v||0).toLocaleString('es-PE'),
  s: v => Number(v||0).toLocaleString('es-PE',{maximumFractionDigits:0}),
  // compacto para tarjetas angostas: S/ 850 · S/ 1.2k · S/ 12k
  sk: v => { v = Number(v||0);
             return 'S/ ' + (v >= 10000 ? Math.round(v/1000) + 'k'
                           : v >= 1000 ? (v/1000).toFixed(1) + 'k'
                           : v.toLocaleString('es-PE',{maximumFractionDigits:0})); },
  t: v => Number(v||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}),
  pct: v => (Number(v||0)*100).toFixed(2)+'%',
  hm: d => d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false}),
};
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let DATA = null;

async function traer(){
  for (const u of FUENTES){
    try{
      const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
      if (r.ok) return await r.json();
    }catch(e){}
  }
  return null;
}

function nombreEvento(hoy){
  // La noche de lanzamiento (vispera desde las 20:00) ya muestra el evento.
  const d = new Date(hoy);
  const manana = new Date(d.getTime() + 4*3600e3);
  const iso = x => x.toLocaleDateString('en-CA');
  for (const [n, ini, fin] of EVENTOS){
    if (iso(d) >= ini && iso(d) <= fin) return n;
    if (iso(manana) === ini) return n;
  }
  return null;
}

function reloj(){
  const ahora = new Date();
  document.getElementById('hora').textContent =
    ahora.toLocaleTimeString('es-PE',{hour12:false});
  document.getElementById('fecha').textContent =
    ahora.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});
  const ev = nombreEvento(ahora);
  document.getElementById('ev').innerHTML = ev
    ? '<span class="ev">'+ev+'</span> · VENTAS EN VIVO' : 'VENTAS EN VIVO';
  frescura();
}

function frescura(){
  const el = document.getElementById('fresh');
  if (!DATA || !DATA.generado){ el.className='fresh warn'; el.textContent='Cargando…'; return; }
  const min = (Date.now() - new Date(DATA.generado).getTime()) / 60000;
  const t = min < 1 ? 'hace menos de 1 min' : 'hace ' + Math.round(min) + ' min';
  el.className = 'fresh ' + (min <= FRESCO_MIN ? 'ok' : min <= ATRASO_MIN ? 'warn' : 'bad');
  el.textContent = 'Datos de ' + t + ' · ' + fmt.hm(new Date(DATA.generado));
}

/* ---------------- render ---------------- */
function funnelHTML(f, m){
  // tipo "sesiones" (como GA4): cada paso cuenta SESIONES, nunca supera al anterior.
  // tipo "unidades" (respaldo): fichas vistas / unidades al carrito / compradas.
  const pasos = f.tipo === 'sesiones'
    ? [['Sesiones',f.sesiones], ['Vieron producto',f.vistos],
       ['Agregaron al carrito',f.carrito], ['Compraron',f.comprados]]
    : [['Vistos',f.vistos], ['Al carrito',f.carrito], ['Comprados',f.comprados]];
  // Embudo: el ancho baja de forma pareja (forma fija, legible aunque las cifras
  // caigan 100x); los numeros y el % de paso dan la magnitud real.
  const W = 400, CX = 165, H = 34, G = 5, TOP = 330, BOT = 120;
  const n = pasos.length, alto = n*H + (n-1)*G;
  const ancho = y => TOP - (TOP-BOT) * (y/alto);
  const txt = (MARCAS[m]||{}).txt || '#fff';
  let svg = '<svg viewBox="0 0 '+W+' '+alto+'" preserveAspectRatio="xMidYMid meet">';
  pasos.forEach(([nom, v], i) => {
    const y0 = i*(H+G), y1 = y0 + H, a0 = ancho(y0)/2, a1 = ancho(y1)/2;
    const op = (1 - i*0.16).toFixed(2);
    svg += '<polygon points="'+(CX-a0)+','+y0+' '+(CX+a0)+','+y0+' '+(CX+a1)+','+y1+' '+(CX-a1)+','+y1+'" '+
           'style="fill:var('+((MARCAS[m]||{}).css||'--muted')+')" opacity="'+op+'"/>';
    svg += '<text class="bandtxt" x="'+CX+'" y="'+(y0+H/2+5)+'" text-anchor="middle" font-size="13" fill="'+txt+'">'+
           esc(nom)+' · '+fmt.n(v)+'</text>';
    if (i) {   // % que pasa desde el paso anterior, a la derecha
      const prev = pasos[i-1][1];
      const pc = prev ? (v/prev*100) : 0;
      svg += '<text class="conv" x="'+(CX+TOP/2+12)+'" y="'+(y0+H/2+5)+'" font-size="13">▼ '+
             (pc >= 10 ? pc.toFixed(0) : pc.toFixed(1))+'%</text>';
    }
  });
  return svg + '</svg>';
}

function fuentesHTML(fs){
  // % sesiones = participacion del canal en las sesiones de la marca. Se calcula
  // sobre el total (incluye "Otros", que no se muestra), asi es el peso real.
  if (!fs || !fs.length) return '<div class="empty">Sin datos de tráfico aún</div>';
  const totSes = fs.reduce((a,x)=>a+(x.sesiones||0),0);
  const filas = fs.filter(x => x.fuente !== 'Otros').slice(0, FILAS_FUENTES);
  return '<table class="src"><thead><tr><th>Canal</th><th>% sesiones</th>'+
    '<th>Sesiones</th><th>Trx</th><th>Venta gross</th></tr></thead><tbody>'+
    filas.map(x=>{
      const sh = totSes ? x.sesiones/totSes : 0;
      return '<tr><td class="nm">'+esc(x.fuente)+'</td>'+
        '<td class="sh">'+(sh*100).toFixed(0)+'%</td>'+
        '<td class="u">'+fmt.n(x.sesiones)+'</td><td class="u">'+fmt.n(x.compras)+'</td>'+
        '<td class="s">S/ '+fmt.s(x.ingresos)+'</td></tr>';
    }).join('')+'</tbody></table>';
}

function topHTML(top){
  if (!top || !top.length) return '<div class="empty">Aún sin compras hoy</div>';
  return '<table><thead><tr><th>#</th><th>Producto</th><th>Unid.</th><th>Ventas</th></tr></thead><tbody>'+
    top.slice().sort((a,b)=>(b.ingresos||0)-(a.ingresos||0)).slice(0, FILAS_TOP).map((p,i)=>'<tr><td class="r">'+(i+1)+'</td>'+
      '<td class="nm" title="'+esc(p.nombre)+(p.sku?' · '+esc(p.sku):'')+'">'+esc(p.nombre)+'</td>'+
      '<td class="u">'+fmt.n(p.comprados)+'</td><td class="s">S/ '+fmt.s(p.ingresos)+'</td></tr>').join('')+
    '</tbody></table>';
}

function columna(m, b){
  const k = b.kpis;
  const estado = b.ok
    ? '<span class="st ok">● En línea</span>'
    : '<span class="st bad" title="'+esc(b.error||'')+'">⚠ Último dato '+fmt.hm(new Date(b.actualizado))+'</span>';
  return '<div class="col" style="--c:var('+MARCAS[m].css+')">'+
    '<div class="bh"><span class="bn">'+MARCAS[m].nombre+'</span>'+estado+'</div>'+
    '<div><div class="lbl">Ventas gross · hoy</div>'+
      '<div class="big"><small>S/</small>'+fmt.s(k.ingresos)+'</div></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="lbl">Sesiones</div><div class="v">'+fmt.n(k.sesiones)+'</div></div>'+
      '<div class="kpi"><div class="lbl">Transacc.</div><div class="v">'+fmt.n(k.compras)+'</div></div>'+
      '<div class="kpi"><div class="lbl">CR</div><div class="v">'+fmt.pct(k.cr)+'</div></div>'+
      '<div class="kpi"><div class="lbl">Ticket</div><div class="v" title="S/ '+fmt.s(k.ticket)+'">'+fmt.sk(k.ticket)+'</div></div>'+
    '</div>'+
    '<div><div class="lbl" style="margin-bottom:.8vh">Funnel del día · '+(b.funnel.tipo==='sesiones'?'sesiones':'unidades de producto')+'</div>'+
      '<div class="funnel">'+funnelHTML(b.funnel, m)+'</div></div>'+
    '<div><div class="lbl" style="margin-bottom:.6vh">Canales · hoy</div>'+fuentesHTML(b.fuentes)+'</div>'+
    '<div class="top10"><div class="lbl" style="margin-bottom:.6vh">Top productos · hoy</div>'+topHTML(b.top)+'</div>'+
  '</div>';
}

function render(){
  const cols = document.getElementById('cols');
  const marcas = Object.keys(MARCAS).filter(m => DATA.marcas && DATA.marcas[m]);
  cols.innerHTML = marcas.map(m => columna(m, DATA.marcas[m])).join('');
  recortarTop();
  const f = (DATA.marcas[marcas[0]]||{}).fecha;
  document.getElementById('dia').textContent = f
    ? 'Día de los KPIs: ' + new Date(f+'T12:00:00').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}) +
      ' (se reinicia a las 00:00)' : '—';
}

// Oculta las filas del top que no entran completas en la columna (nunca se
// ve una fila cortada a la mitad, en ninguna resolucion de pantalla).
function recortarTop(){
  document.querySelectorAll('.top10').forEach(box => {
    const limite = box.getBoundingClientRect().bottom;
    box.querySelectorAll('tbody tr').forEach(tr => {
      tr.style.display = '';
      if (tr.getBoundingClientRect().bottom > limite + 1) tr.style.display = 'none';
    });
  });
}
window.addEventListener('resize', recortarTop);

async function cargar(){
  const d = await traer();
  const err = document.getElementById('err');
  if (!d){ if (!DATA) err.style.display='flex'; return; }
  err.style.display = 'none';
  const nuevo = !DATA || d.generado !== DATA.generado;
  DATA = d;
  if (nuevo) render();
  frescura();
}

reloj(); setInterval(reloj, 1000);
cargar(); setInterval(cargar, REFRESCO_MS);
</script>
</body>
</html>
